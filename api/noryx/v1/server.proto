syntax = "proto3";

package noryx.v1;

option go_package = "github.com/QwikByte/noryx/api/noryx/v1;noryxv1";

// ServerService is served by every agent and manages the Minecraft servers on its node.
service ServerService {
  rpc ListServers(ListServersRequest) returns (ListServersResponse);
  rpc CreateServer(CreateServerRequest) returns (CreateServerResponse);
  rpc StartServer(StartServerRequest) returns (StartServerResponse);
  rpc StopServer(StopServerRequest) returns (StopServerResponse);
  // RestartServer stops a server gracefully and starts it again.
  rpc RestartServer(RestartServerRequest) returns (RestartServerResponse);
  rpc DeleteServer(DeleteServerRequest) returns (DeleteServerResponse);
  // UpdateServer changes the settings of a server. Its container is created again with
  // the same data, and a running server restarts.
  rpc UpdateServer(UpdateServerRequest) returns (UpdateServerResponse);
  // UpdateImage pulls the image of a server again, e.g. for a newer Java. If it changed, the
  // container is created again with it, and a running server restarts.
  rpc UpdateImage(UpdateImageRequest) returns (UpdateImageResponse);
  // StreamLogs sends the last lines of the server console, then follows it until the
  // server stops or the client disconnects. Each line has the time it was written, for
  // clients that connect again to continue after the last line they got.
  rpc StreamLogs(StreamLogsRequest) returns (stream StreamLogsResponse);
  // SendCommand runs a console command and returns its output.
  rpc SendCommand(SendCommandRequest) returns (SendCommandResponse);
  // ConfigureNetwork gives a server its role in a network behind a proxy, in the
  // configuration files of the proxy or game server: a proxy gets its backends and reloads
  // its configuration if it runs, a game server accepts only players forwarded by the proxy
  // and restarts if it runs, and FORWARDING_NONE makes a game server standalone again.
  rpc ConfigureNetwork(ConfigureNetworkRequest) returns (ConfigureNetworkResponse);
  // DuplicateServer creates a server on the same node with a copy of the data and the
  // settings of another one. A running game server saves its worlds first. The copy is
  // stopped and standalone: it doesn't take over the network role of the original.
  rpc DuplicateServer(DuplicateServerRequest) returns (DuplicateServerResponse);
  // ImportServer creates a stopped server with the ID and settings of a server of another
  // node, e.g. one that moves here. The header describes it, the data that follows is its
  // data directory as a ZIP archive, like ArchiveDirectory sends it.
  rpc ImportServer(stream ImportServerRequest) returns (ImportServerResponse);
}

enum ServerType {
  SERVER_TYPE_UNSPECIFIED = 0;
  SERVER_TYPE_VANILLA = 1;
  SERVER_TYPE_PAPER = 2;
  SERVER_TYPE_PURPUR = 3;
  SERVER_TYPE_FABRIC = 4;
  SERVER_TYPE_FORGE = 5;
  SERVER_TYPE_NEOFORGE = 6;
  // Proxies connect several servers to one network.
  SERVER_TYPE_VELOCITY = 7;
  SERVER_TYPE_BUNGEECORD = 8;
  SERVER_TYPE_WATERFALL = 9;
  // Forks of Paper with its configuration: Folia runs regions of the worlds in parallel and
  // only loads plugins made for it, Leaf optimises performance.
  SERVER_TYPE_FOLIA = 10;
  SERVER_TYPE_LEAF = 11;
  // Quilt loads its own mods and those of Fabric.
  SERVER_TYPE_QUILT = 12;
}

// RestartPolicy decides when the node starts a server on its own.
enum RestartPolicy {
  // Same as RESTART_POLICY_ALWAYS.
  RESTART_POLICY_UNSPECIFIED = 0;
  // Start with the node and after a crash, unless the server was stopped.
  RESTART_POLICY_ALWAYS = 1;
  // Start again after a crash.
  RESTART_POLICY_ON_CRASH = 2;
  // Only start when asked to.
  RESTART_POLICY_NEVER = 3;
}

enum ServerState {
  SERVER_STATE_UNSPECIFIED = 0;
  SERVER_STATE_STOPPED = 1;
  SERVER_STATE_STARTING = 2;
  SERVER_STATE_RUNNING = 3;
  // The server crashed and the node starts it again. After several crashes in a row, the
  // agent stops it.
  SERVER_STATE_CRASHING = 4;
}

message Server {
  string id = 1;
  string name = 2;
  ServerType type = 3;
  // Minecraft version, e.g. "1.21.4" or "LATEST".
  string version = 4;
  uint32 memory_mb = 5;
  uint32 port = 6;
  ServerState state = 7;
  // Storage location of the server's data on the node.
  string storage = 8;
  // Java version of game servers, e.g. "21"; empty for the newest.
  string java = 9;
  RestartPolicy restart_policy = 10;
  // Use the JVM flags recommended by Aikar for Paper and its forks.
  bool aikar_flags = 11;
  // Additional JVM options, e.g. "-Dfile.encoding=UTF-8".
  repeated string jvm_options = 12;
  // CPU limit in thousandths of a core; 0 means no limit.
  uint32 cpu_millis = 13;
  // How often a crashing server, or one that stopped after a crash, crashed since it was
  // last started; 0 for servers that run or stopped cleanly.
  uint32 crashes = 14;
  // Exit code of the latest crash, if known.
  int32 exit_code = 15;
  // Version of the mod loader of Fabric, Quilt, Forge and NeoForge servers, e.g. "0.16.10";
  // empty for the newest.
  string loader_version = 16;
  // For a proxy whose network lets Bedrock players join: the UDP port at which Geyser
  // listens for them; 0 for none.
  uint32 bedrock_port = 17;
}

message ListServersRequest {}

message ListServersResponse {
  repeated Server servers = 1;
}

message CreateServerRequest {
  string name = 1;
  ServerType type = 2;
  string version = 3;
  uint32 memory_mb = 4;
  uint32 port = 5;
  // The operator must accept the Minecraft EULA (https://aka.ms/MinecraftEULA).
  bool accept_eula = 6;
  // Storage location for the server's data; empty means the default location.
  string storage = 7;
  // Settings as in UpdateServerRequest.
  string java = 8;
  RestartPolicy restart_policy = 9;
  bool aikar_flags = 10;
  repeated string jvm_options = 11;
  uint32 cpu_millis = 12;
  // Properties of server.properties for a game server, written before its first start.
  map<string, string> properties = 13;
  string loader_version = 14;
}

message CreateServerResponse {
  Server server = 1;
}

message StartServerRequest {
  string id = 1;
}

message StartServerResponse {}

message StopServerRequest {
  string id = 1;
}

message StopServerResponse {}

message RestartServerRequest {
  string id = 1;
}

message RestartServerResponse {}

message UpdateServerRequest {
  string id = 1;
  string name = 2;
  string version = 3;
  uint32 memory_mb = 4;
  uint32 port = 5;
  string java = 6;
  RestartPolicy restart_policy = 7;
  bool aikar_flags = 8;
  repeated string jvm_options = 9;
  uint32 cpu_millis = 10;
  string loader_version = 11;
}

message UpdateServerResponse {
  Server server = 1;
}

message UpdateImageRequest {
  string id = 1;
}

message UpdateImageResponse {
  // updated tells whether the image changed. If not, the server was left alone.
  bool updated = 1;
}

message DeleteServerRequest {
  string id = 1;
}

message DeleteServerResponse {}

message StreamLogsRequest {
  string id = 1;
  // Number of past lines to send first, at most 1000.
  uint32 tail = 2;
  // Leaves out the past lines up to this time, e.g. those a client that connects again
  // has already; 0 leaves out none.
  int64 after_unix_nano = 3;
}

message StreamLogsResponse {
  string line = 1;
  // When the server wrote the line; 0 if unknown.
  int64 time_unix_nano = 2;
}

message SendCommandRequest {
  string id = 1;
  // A single console command, e.g. "say Hello". A leading slash is optional.
  string command = 2;
}

message SendCommandResponse {
  string output = 1;
}

message ConfigureNetworkRequest {
  string id = 1;
  // Shared secret of Velocity's modern forwarding.
  string forwarding_secret = 2;
  // Backends of a proxy.
  repeated NetworkBackend backends = 3;
  // For a backend: its proxy runs on the same node and reaches it over a Docker network,
  // so its port isn't published.
  bool proxy_on_node = 4;
  // How the proxy forwards players to its backends. Unspecified means modern forwarding
  // if a secret is set, and otherwise FORWARDING_NONE, as older masters sent it.
  Forwarding forwarding = 5;
  // For a proxy: the backends players join and fall back to, in this order. Empty means
  // the first backend, as older masters sent it.
  repeated string try = 6;
  // For a proxy: the backends players join when they connect through a host name.
  repeated ForcedHost forced_hosts = 7;
  // For a proxy: the UDP port at which Geyser lets Bedrock players join, which the node
  // publishes; 0 for none. The master installs Geyser and Floodgate.
  uint32 bedrock_port = 8;
  // For a backend: Bedrock players join it through the proxy. They can't sign their chat
  // messages, so the server must not demand it.
  bool bedrock_players = 9;
}

enum Forwarding {
  FORWARDING_UNSPECIFIED = 0;
  // Not part of a network: a game server accepts players directly.
  FORWARDING_NONE = 1;
  // Velocity's modern forwarding, signed with the forwarding secret.
  FORWARDING_MODERN = 2;
  // BungeeCord's forwarding (ip_forward), which Velocity calls legacy. It doesn't prove that
  // players come through the proxy, so only the proxy may reach the backends.
  FORWARDING_LEGACY = 3;
}

message NetworkBackend {
  // Name players use, e.g. in /server lobby.
  string name = 1;
  oneof target {
    // A server on the same node as the proxy.
    string server_id = 2;
    // host:port of a server on another node.
    string address = 3;
  }
  // BungeeCord: only players with the permission bungeecord.server.<name> may join it.
  bool restricted = 4;
  // BungeeCord: the MOTD shown for host names that lead to it.
  string motd = 5;
}

// ForcedHost sends players who connect through a host name to certain backends.
message ForcedHost {
  // e.g. survival.example.com
  string host = 1;
  // Names of the backends, tried in this order. BungeeCord takes only one.
  repeated string servers = 2;
}

message ConfigureNetworkResponse {
  // A running server restarted to apply the configuration, rather than reloading it.
  bool restarted = 1;
}

message DuplicateServerRequest {
  // The server to copy.
  string id = 1;
  string name = 2;
  uint32 port = 3;
}

message DuplicateServerResponse {
  Server server = 1;
}

message ImportServerRequest {
  oneof content {
    Server header = 1;
    bytes data = 2;
  }
}

message ImportServerResponse {
  Server server = 1;
}
