syntax = "proto3";

package noryx.v1;

option go_package = "github.com/QwikByte/mc-server-manager/api/noryx/v1;noryxv1";

// PropertiesService is served by every agent and edits the server.properties of game
// servers. Servers read the file when they start.
service PropertiesService {
  rpc GetServerProperties(GetServerPropertiesRequest) returns (GetServerPropertiesResponse);
  // UpdateServerProperties sets the given properties and keeps the rest of the file,
  // including comments.
  rpc UpdateServerProperties(UpdateServerPropertiesRequest) returns (UpdateServerPropertiesResponse);
}

message GetServerPropertiesRequest {
  string server_id = 1;
}

message GetServerPropertiesResponse {
  // False until the server started once and created the file.
  bool exists = 1;
  map<string, string> properties = 2;
  // Properties the manager sets itself, which can't be changed. Secret values are left
  // out of properties.
  repeated LockedProperty locked = 3;
}

message LockedProperty {
  string key = 1;
  string reason = 2;
}

message UpdateServerPropertiesRequest {
  string server_id = 1;
  map<string, string> properties = 2;
}

message UpdateServerPropertiesResponse {}
