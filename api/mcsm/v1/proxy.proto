syntax = "proto3";

package mcsm.v1;

import "mcsm/v1/properties.proto";

option go_package = "github.com/QwikByte/mc-server-manager/api/mcsm/v1;mcsmv1";

// ProxyService is served by every agent and edits the settings of proxies in their own
// configuration file: velocity.toml of Velocity, config.yml of BungeeCord and Waterfall.
service ProxyService {
  rpc GetProxySettings(GetProxySettingsRequest) returns (GetProxySettingsResponse);
  // UpdateProxySettings changes settings that the file has and keeps the others. A running
  // proxy reloads its configuration.
  rpc UpdateProxySettings(UpdateProxySettingsRequest) returns (UpdateProxySettingsResponse);
}

message GetProxySettingsRequest {
  string server_id = 1;
}

message GetProxySettingsResponse {
  // False until the proxy started once and created its configuration.
  bool exists = 1;
  // The configuration file, e.g. velocity.toml.
  string file = 2;
  // Settings by their path in the file, e.g. "advanced.compression-threshold" or
  // "listeners.0.motd", as JSON: strings, numbers, booleans and lists of strings.
  map<string, string> settings = 3;
  // Settings the manager or the network decides, which can't be changed here.
  repeated LockedProperty locked = 4;
}

message UpdateProxySettingsRequest {
  string server_id = 1;
  // New values by path, as JSON of the same kind as the current value.
  map<string, string> settings = 2;
}

message UpdateProxySettingsResponse {
  // The proxy runs and reloaded its configuration.
  bool reloaded = 1;
}
